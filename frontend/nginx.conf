server {
    listen 80;
    server_name localhost;

    # Proxy API — ^~ court-circuite les blocs regex pour toute URL /api/...
    # (images de recettes incluses : /api/assets/slug/images/principale.jpg)
    location ^~ /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html : jamais caché pour garantir le chargement du dernier bundle JS
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Service worker : JAMAIS caché. Sans ces blocs exacts (prioritaires sur la
    # regex assets ci-dessous), sw.js héritait de "immutable 1y" : un proxy
    # intermédiaire ou un navigateur en updateViaCache!=imports pouvait figer
    # définitivement la PWA sur une vieille version. Le precache-manifest des
    # assets hashés est embarqué dans sw.js — c'est lui qui doit être frais.
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /registerSW.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Manifest PWA : servi avec le bon Content-Type (absent du mime.types
    # nginx-alpine par défaut). Via `types`/`default_type` et non `add_header
    # Content-Type`, qui AJOUTAIT un second Content-Type à côté de
    # application/octet-stream au lieu de le remplacer.
    location ~* \.webmanifest$ {
        root /usr/share/nginx/html;
        types { application/manifest+json webmanifest; }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Icônes PWA et favicons NON hashés (remplaçables sans renommage) : cache
    # modéré — en immutable 1 an, un remplacement resterait invisible jusqu'à
    # un an pour les fetch directs du navigateur (manifest, apple-touch-icon).
    # Premier bloc regex : prioritaire sur la regex assets générique ci-dessous.
    location ~* ^/(?:icons/.+\.png|apple-touch-icon\.png|favicon\.(?:ico|svg))$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Assets Vite hashés (JS/CSS/fonts/images) : cache longue durée, jamais sur /api/.
    # Un seul en-tête Cache-Control complet — `expires 1y` + `add_header
    # Cache-Control` produisait DEUX en-têtes Cache-Control distincts.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|ico|webp|png|jpg|jpeg|gif)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        # Défense en profondeur. Les navigations ("/", deep links SPA) reçoivent
        # DÉJÀ les en-têtes no-cache du bloc exact /index.html : le dernier
        # paramètre de try_files déclenche une redirection interne qui re-matche
        # les locations. Ces en-têtes couvrent les fichiers servis directement
        # par ce bloc (sans extension matchée par la regex assets, ex. robots.txt).
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
