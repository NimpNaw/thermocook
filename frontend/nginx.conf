server {
    listen 80;
    server_name localhost;

    # Proxy API — ^~ court-circuite les blocs regex pour toute URL /api/...
    # (images de recettes incluses : /api/assets/slug/images/principale.jpg)
    location ^~ /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html : jamais caché pour garantir le chargement du dernier bundle JS
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Manifest PWA : servi avec le bon Content-Type (absent du mime.types nginx-alpine par défaut)
    location ~* \.webmanifest$ {
        root /usr/share/nginx/html;
        add_header Content-Type "application/manifest+json";
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Assets Vite hashés (JS/CSS/fonts/images) : cache longue durée, jamais sur /api/
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|ico|webp|png|jpg|jpeg|gif)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
